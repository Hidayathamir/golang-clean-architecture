services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: elasticsearch-clean-arch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0
    container_name: kibana-clean-arch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  redis:
    image: redis:7-alpine
    container_name: redis-clean-arch
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18.1
    container_name: postgres-clean-arch
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: golang_clean_architecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.15
    container_name: zookeeper-clean-arch
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo ruok > /dev/tcp/127.0.0.1/2181 && exit 0 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.2.15
    container_name: kafka-clean-arch
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka-data:/var/lib/kafka/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.8.0
    container_name: redpanda-console-clean-arch
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "kafka:29092"
    depends_on:
      - kafka

  minio:
    image: cgr.dev/chainguard/minio@sha256:b288eaa709ba2f799a39e9a8ceda71a08fabf90109b12c90badba9afff29485c
    container_name: minio-clean-arch
    ports:
      - "9100:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=test
      - MINIO_ROOT_PASSWORD=testtesttest
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc alias set h http://127.0.0.1:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\" >/dev/null && mc ready h"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit-clean-arch
    ports:
      - "1025:1025"
      - "8025:8025"

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: lgtm-clean-arch
    ports:
      - "3001:3000"
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtm-data:/data
    restart: unless-stopped

volumes:
  lgtm-data:
    name: lgtm-data
  kafka-data:
    name: kafka-data
  zookeeper-data:
    name: zookeeper-data
  zookeeper-log:
    name: zookeeper-log
