paths:
  /api/explore:
    get:
      description: Discover posts via Elasticsearch, newest first (cursor paginated)
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page; empty for the first page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_ExploreResponse'
      security:
      - SimpleApiKeyAuth: []
      summary: Explore images
      tags:
      - images
  /api/feed:
    get:
      description: Get posts from users the current user follows, newest first (cursor
        paginated)
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page; empty for the first page
        in: query
        name: cursor
