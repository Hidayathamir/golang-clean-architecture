      security:
      - SimpleApiKeyAuth: []
      summary: Get feed
      tags:
      - images
  /api/images:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image file
      parameters:
      - description: Image to upload
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
