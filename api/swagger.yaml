  contact: {}
  title: Golang Clean Architecture
paths:
  /api/chats:
    post:
      parameters:
      - description: Send Chat Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_dto.SendChatRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_ChatResponse'
      summary: Send a chat
      tags:
      - chats
  /api/chats/_read:
    post:
      parameters:
      - description: Mark Chat Read Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_dto.MarkChatReadRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-any'
      summary: Mark a chat thread read
      tags:
      - chats
  /api/chats/_unread_count:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_UnreadChatCountResponse'
      summary: Unread chat count
      tags:
      - chats
  /api/chats/{userId}:
    get:
      parameters:
      - description: peer user id
        in: path
        name: userId
        required: true
        type: integer
      - description: page size
        in: query
        name: limit
        type: integer
      - description: opaque cursor
        in: query
        name: cursor
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_ThreadResponse'
      summary: Get a chat thread with a user
      tags:
      - chats
  /api/chats/conversations:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_ConversationsResponse'
      summary: List chat conversations
      tags:
      - chats
  /api/explore:
    get:
      description: Discover posts via Elasticsearch, newest first (cursor paginated)
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page; empty for the first page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_ExploreResponse'
      security:
      - SimpleApiKeyAuth: []
      summary: Explore images
      tags:
      - images
  /api/feed:
    get:
      description: Get posts from users the current user follows, newest first (cursor
        paginated)
      parameters:
      - description: Page size (default 20, max 100)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from the previous page; empty for the first page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_Hidayathamir_golang-clean-architecture_internal_inbound_http_response.WebResponse-github_com_Hidayathamir_golang-clean-architecture_internal_dto_FeedResponse'
      security:
      - SimpleApiKeyAuth: []
      summary: Get feed
      tags:
      - images
  /api/images:
    post:
