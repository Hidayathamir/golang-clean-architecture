name: rules

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Decorator pattern + file naming
        run: make check-rules

  check-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install moq and swag
        run: |
          go install github.com/matryer/moq@latest
          go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generated code is fresh
        run: make check-codegen